<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falta 1</title>
    <!-- Tipografía moderna Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="app-header">
        <h1>Falta 1</h1>
        <button id="btn-logout" class="btn-secondary hidden">Cerrar Sesión</button>
    </header>

    <main class="container">
        <!-- Pantalla de Login / Registro -->
        <section id="auth-section" class="card">
            <h2 id="auth-title">Iniciar Sesión</h2>
            
            <form id="auth-form">
                <div class="form-group">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" required placeholder="tu@email.com">
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" required placeholder="******">
                </div>

                <!-- Campos de perfil -->
                <div id="register-fields" class="hidden">
                    <div class="form-group">
                        <label for="full-name">Nombre y Apellido:</label>
                        <input type="text" id="full-name" placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="form-group">
                        <label for="position">Posición / Rol habitual:</label>
                        <input type="text" id="position" placeholder="Ej: Delantero, Arquero, Armador...">
                    </div>

                    <div class="form-group">
                        <label for="zone">Zona / Barrio:</label>
                        <input type="text" id="zone" placeholder="Ej: La Paternal, Palermo, Olivos...">
                    </div>
                </div>

                <button type="submit" id="btn-auth-submit" class="btn-primary">Ingresar</button>
            </form>

            <p class="toggle-auth">
                <span id="toggle-text">¿No tenés cuenta?</span> 
                <a href="#" id="toggle-auth-btn">Registrate acá</a>
            </p>
        </section>

        <!-- Pantalla Principal (Partidos) -->
        <section id="app-section" class="hidden">
            <div class="user-welcome">
                <p>Hola, <strong id="user-display-name">Jugador</strong> 👋</p>
            </div>

            <h2>Partidos Disponibles</h2>
            <div id="lista-partidos" class="partidos-grid">
                <p class="loading-text">Cargando partidos...</p>
            </div>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

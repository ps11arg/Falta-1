<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falta 1 - Encuentra tu partido</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Carga del SDK oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <header class="app-header">
        <h1>FALTA 1 ⚽🏐</h1>
        <p>Conectando partidos y jugadores libres</p>
    </header>

    <main class="container">
        <section class="action-bar">
            <h2>Partidos Disponibles</h2>
            <button id="btn-nuevo-partido" class="btn-primary">+ Publicar Partido</button>
        </section>

        <!-- Lista donde se cargarán los partidos dinámicamente desde Supabase -->
        <div id="lista-partidos" class="partidos-grid">
            <p class="loading-text">Cargando partidos...</p>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>

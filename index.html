<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Falta 1 - Splash Screen</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #0b0e14; /* Fondo oscuro acorde al logo */
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .step {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      animation: fadeIn 0.5s ease-in-out;
    }

    .active { display: flex; }

    /* Logo inicial */
    .logo-img {
      width: 280px;
      height: auto;
      border-radius: 20px;
      box-shadow: 0 0 25px rgba(204, 255, 0, 0.2);
    }

    /* Estilos de textos */
    h1 { font-size: 2rem; color: #ccff00; margin-bottom: 15px; }
    p { font-size: 1.2rem; color: #e0e0e0; max-width: 400px; line-height: 1.5; }

    /* Spinner */
    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.1);
      border-top: 5px solid #ccff00;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>
<body>

  <!-- PASO 1: LOGO -->
  <div id="step1" class="step active">
    <img src="Logo Falta Uno.jfif" alt="Falta Uno Logo" class="logo-img">
  </div>

  <!-- PASO 2: BIENVENIDA -->
  <div id="step2" class="step">
    <h1>¡Te damos la bienvenida a Falta 1!</h1>
    <p>La app para encontrar tu partido ideal, sumar gente y no quedarte afuera jamás.</p>
  </div>

  <!-- PASO 3: MATCH DEPORTIVO -->
  <div id="step3" class="step">
    <p style="font-size: 1.5rem; color: #ccff00; font-weight: bold;">
      El match deportivo que necesitabas... ⚽🏀🏐
    </p>
  </div>

  <!-- PASO 4: CARGANDO -->
  <div id="step4" class="step">
    <div class="spinner"></div>
    <p>Cargando...</p>
  </div>

  <script>
    function showStep(stepNumber) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById('step' + stepNumber).classList.add('active');
    }

    // Temporizadores de 3 segundos por etapa (3000ms)
    setTimeout(() => showStep(2), 3000); // 3 seg -> Bienvenida
    setTimeout(() => showStep(3), 6000); // 6 seg -> Match deportivo
    setTimeout(() => showStep(4), 9000); // 9 seg -> Cargando...

    // 12 seg -> Redirección a la pantalla de Login / Registro
    setTimeout(() => {
      // Reemplazar esta URL por tu pantalla de inicio de sesión
      window.location.href = "login.html"; 
    }, 12000);
  </script>

</body>
</html>
